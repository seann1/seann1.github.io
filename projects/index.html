<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Projects – Sean Niesen</title><script type="module" crossorigin src="/assets/projects-72c6cea4.js"></script><link rel="modulepreload" crossorigin href="/assets/modulepreload-polyfill-3cfb730f.js"><link rel="modulepreload" crossorigin href="/assets/reel-c517e403.js"><link rel="stylesheet" href="/assets/projects-0efa9c23.css"></head><body><div class="marquee-wrapper"><div id="marquee"><span>Sean Niesen Live Production &amp; Creative Technology&nbsp;</span></div></div><div class="reel-header"><a href="/" class="logo"><img src="/images/sn-logo-grey.svg" alt="Sean Niesen"/> </a><a href="/" class="back-btn">← Back</a></div><main class="projects-list"><project-item title="Winter Light Festival 2026" subtitle="Portland, OR" tags="TouchDesigner, webcam, real-time particle system, audio-reactive geometry, rear projection" description="Installed in the storefront windows of the historic Galleria building at SW 10th and Alder during Portland's Winter Light Festival 2026, this interactive work transformed passersby into pixelated, luminous figures projected across a large rear-projection surface visible from the street. A webcam mounted to the building's exterior captured pedestrians in real time, rendering their forms as colorful particle geometry using TouchDesigner's particle operators (POPs). The geometry responded dynamically to ambient audio — sound amplitude driving Perlin noise deformation across the mesh, so the figures breathed and pulsed with the surrounding soundscape. Viewers encountering their own transformed image in the window from the street experienced the work as both a mirror and a disruption — recognizable but abstracted, present but pixelated." pictures='["/images/projects/WLF-2026/WLF-1.jpg", {"type":"youtube","id":"I-EhOmxteSA"}, {"type":"short","id":"fdRsK8X1--o"}, {"type":"short","id":"tMWHOOSBPIA"}, "/images/projects/WLF-2026/WLF-2.jpg", "/images/projects/WLF-2026/WLF-3.jpg"]'></project-item><project-item title="NextNW Creative &amp; Marketing Networking Event" subtitle="Portland, OR — March 2026" tags="TouchDesigner, Orbbec Femto Bolt depth cameras (×2), real-time point cloud, particle system, dual projection" description="A dual-projection interactive installation created for NextNW's creative and marketing networking event at i9FX's Portland office. Using two Orbbec depth cameras and two independent TouchDesigner systems, the work occupied both levels of the venue's loft space simultaneously. On the main floor, a depth camera mounted on the loft captured the crowd below and projected their collective point cloud onto the wall above them in real time — the entire room rendered as luminous, pixelated figures overhead. Upstairs in the loft, a second and more intimate projection was visible only to those who made their way up: a depth camera captured individual silhouettes and generated a dynamic particle system from their form, producing explosive, colorful figures that dissolved and reformed with each person's movement." pictures='["/images/projects/NextNW/NextNW-1.jpg", "/images/projects/NextNW/NextNW-2.jpg", {"type":"short","id":"LrrrD4Mpwwc"}, "/images/projects/NextNW/NextNW-3.jpg"]'></project-item><project-item title="BET’s I Saw That on the Internet" subtitle="Motion &amp; Broadcast Graphics — Freelance via Posthumous LLC, 2026" tags="After Effects, broadcast graphics, motion design, keyframe animation" description="Freelance motion graphics work on BET’s I Saw That on the Internet, produced through Posthumous LLC. Built the show’s 30-tile video wall graphics system in After Effects — the grid of social clips that plays behind the hosts — as part of the show’s broadcast graphics package. Also designed the &quot;I Saw This&quot; tweet-card template used throughout the show, created several of the torn-paper background textures and their animation, hand-built a number of the keyframe animations, and handled a lot of the repetitive production work a weekly broadcast turnaround requires — duplicating and re-timing templates across segments and keeping the package consistent episode to episode." pictures='["/images/projects/BET/vlcsnap-2026-11-17-14h41m30s346.png", "/images/projects/BET/vlcsnap-2026-11-17-14h42m27s455.png", "/images/projects/BET/vlcsnap-2026-11-17-14h38m28s786.png", "/images/projects/BET/vlcsnap-2026-11-17-14h41m47s677.png", "/images/projects/BET/vlcsnap-2026-11-17-14h40m50s614.png"]'></project-item></main></body></html>
